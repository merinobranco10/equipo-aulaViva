
name: AulaViva - CI Quality Gates

on:
  push:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality - Lint, Tests, Coverage and SAST
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21 y cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar lint, pruebas y cobertura
        working-directory: backend
        run: mvn -B verify

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Ejecutar analisis SAST
        run: semgrep scan --config p/java --error backend/

  build:
    name: Build - Docker image validation
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

  promote:
    name: Promote - Pending GitOps repository
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Informar que la promocion esta pendiente
        run: |
          echo "Quality y build finalizaron correctamente."
          echo "La promocion real queda pendiente de crear y configurar el repositorio GitOps."
