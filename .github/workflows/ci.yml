name: AulaViva - CI Quality Gates

on:
  push:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/equipo-aulaviva-backend

jobs:
  quality:
    name: Quality - Maven, Coverage and SAST
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar pruebas y verificaciones Maven
        id: maven
        continue-on-error: true
        working-directory: backend
        run: mvn -B verify

      - name: Publicar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Configurar Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        if: always()
        run: python -m pip install semgrep

      - name: Ejecutar analisis SAST
        if: always()
        run: semgrep scan --config p/java --error backend/

      - name: Rechazar si Maven falla
        if: always() && steps.maven.outcome != 'success'
        run: |
          echo "Maven fallo: revisa las pruebas y la cobertura JaCoCo."
          exit 1

  build-and-push:
    name: Build and Publish - GHCR
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/desarrollo'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar etiqueta SHA completa
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Construir y publicar imagen
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Registrar referencia y digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Commit: ${COMMIT_SHA}"
          echo "Imagen: ${IMAGE}:sha-${COMMIT_SHA}"
          echo "Digest: ${IMAGE_DIGEST}"
          echo "Referencia inmutable: ${IMAGE}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote - GitOps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.result == 'success'

    steps:
      - name: Verificar publicacion
        run: |
          echo "La imagen se publico despues de superar los controles de calidad."
          echo "Pendiente: configurar el repositorio GitOps y crear el PR."
