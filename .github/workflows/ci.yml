name: AulaViva - CI Quality Gates

on:
  push:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - "terraform/**"      # <-- Agregado para que se dispare si tocan Terraform
      - "k8s/**"            # <-- Agregado para que se dispare si tocan K8s
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - main
      - desarrollo
    paths:
      - "backend/**"
      - "terraform/**"      # <-- Agregado
      - "k8s/**"            # <-- Agregado
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/equipo-aulaviva-backend

jobs:
  quality:
    name: Quality - Maven and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Ejecutar pruebas y verificaciones Maven
        id: maven
        working-directory: backend
        run: mvn -B verify
      - name: Publicar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
      - name: Rechazar si Maven falla
        if: always() && steps.maven.outcome != 'success'
        run: |
          echo "Maven fallo: revisa las pruebas y la cobertura JaCoCo."
          exit 1

  build-and-push:
    name: Build and Publish - GHCR
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/desarrollo'
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      tag: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generar etiqueta SHA completa
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
      - name: Construir y publicar imagen
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: mode=max,version=v0.2
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generar provenance firmada por GitHub
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Registrar referencia y digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "Commit: ${COMMIT_SHA}"
          echo "Imagen: ${IMAGE}:sha-${COMMIT_SHA}"
          echo "Digest: ${IMAGE_DIGEST}"
          echo "Referencia inmutable: ${IMAGE}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${COMMIT_SHA}" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------
  # NUEVOS JOBS AGREGADOS POR TI (S10)
  # ---------------------------------------------------------
  iac-scan:
    name: IaC Scan - Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Ejecutar Checkov sobre Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false # Bloqueante: si falla, el pipeline se detiene
          output_format: sarif
          output_file_path: checkov.sarif
      - name: Subir resultados de Checkov a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif

  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build-and-push # Depende de que la imagen se haya construido y subido
    if: github.event_name == 'push' && github.ref == 'refs/heads/desarrollo'
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Ejecutar Trivy (Bloqueante)
        uses: aquasecurity/trivy-action@master
        with:
          # Escanea la imagen usando el digest inmutable que generó el build
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}'
          format: 'table'
          exit-code: '1' # Bloqueante: falla si encuentra HIGH o CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
  # ---------------------------------------------------------

  sign-and-attest:
    name: Sign and Attest - Cosign
    runs-on: ubuntu-latest
    needs: [build-and-push, container-scan] # <-- Modificado: Ahora espera a que el escaneo de contenedor pase
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/equipo-aulaviva-backend
      DIGEST: ${{ needs.build-and-push.outputs.digest }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/desarrollo
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Verificar instalación de Cosign
        run: cosign version
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verificar provenance SLSA de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "oci://${IMAGE}@${DIGEST}" \
            --repo merinobranco10/equipo-aulaViva \
            --signer-workflow merinobranco10/equipo-aulaViva/.github/workflows/ci.yml \
            --source-ref refs/heads/desarrollo
      - name: Extraer provenance de la imagen
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${IMAGE}@${DIGEST}" \
            --format '{{json .Provenance.SLSA}}' \
            > provenance.json
          test -s provenance.json
          jq -e '.builder.id and .buildType and (.materials | type == "array")' provenance.json
      - name: Firmar imagen con Cosign
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Adjuntar attestation SLSA
        run: |
          cosign attest --yes \
            --type slsaprovenance \
            --predicate provenance.json \
            "${IMAGE}@${DIGEST}"
      - name: Verificar firma Cosign
        run: |
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${IMAGE}@${DIGEST}"
      - name: Verificar attestation SLSA
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${IMAGE}@${DIGEST}"


    # ---------------------------------------------------------
  # DAST - OWASP ZAP (Escaneo dinámico)
  # ---------------------------------------------------------
  dast:
    name: DAST - OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/desarrollo'
    steps:
      - name: Escaneo de seguridad dinámico (ZAP)
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'https://aulaviva-staging.example.com' 
          fail_action: true
          cmd_options: '-a'  
  
  promote:
    name: Promote - GitOps
    runs-on: ubuntu-latest
    needs: [build-and-push, sign-and-attest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/desarrollo' && needs.build-and-push.result == 'success' && needs.sign-and-attest.result == 'success'
    steps:
      - name: Descargar repositorio GitOps
        uses: actions/checkout@v4
        with:
          repository: merinobranco10/equipo-aulaviva-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Actualizar imagen por digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/apps/aulaviva-backend/base/deployment.yaml")

          if not path.is_file():
              raise SystemExit(f"No existe el manifiesto: {path}")

          digest = os.environ.get("DIGEST", "")
          if not digest.startswith("sha256:"):
              raise SystemExit("El digest de la imagen no es válido.")

          content = path.read_text()
          pattern = r"(?m)^([ \t]*image:[ \t]*).+$"
          matches = re.findall(pattern, content)

          if len(matches) != 1:
              raise SystemExit(
                  "Se esperaba exactamente una línea image:. "
                  "No se modificó el manifiesto."
              )

          image = f"{os.environ['IMAGE']}@{digest}"
          updated = re.sub(
              pattern,
              lambda match: match.group(1) + image,
              content
          )

          if updated == content:
              print("El manifiesto ya utiliza esta imagen; no hay cambios.")
          else:
              path.write_text(updated)
              print(f"Imagen propuesta: {image}")

          PY
      - name: Crear Pull Request de promoción
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          base: main
          branch: promotion/aulaviva-${{ github.sha }}
          add-paths: apps/aulaviva-backend/base/deployment.yaml
          commit-message: "chore: promote AulaViva backend ${{ github.sha }}"
          title: "Promote AulaViva backend ${{ github.sha }}"
          body: |
            ## Promoción de imagen AulaViva

            - Commit del backend: `${{ github.sha }}`
            - Etiqueta: `ghcr.io/${{ github.repository_owner }}/equipo-aulaviva-backend:sha-${{ github.sha }}`
            - Digest: `${{ needs.build-and-push.outputs.digest }}`

            El manifiesto propone la imagen mediante su digest inmutable.
            Revisar y aprobar antes de integrar en main.
