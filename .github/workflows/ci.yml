name: AulaViva - CI Quality Gates

on:
  push:
    branches:
      - "desarrollo"
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality - Java, Maven and SAST
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar, probar y verificar cobertura
        working-directory: backend
        run: mvn -B verify

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Ejecutar analisis SAST
        run: semgrep scan --config p/java --error backend/
