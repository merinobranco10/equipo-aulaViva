name: Docker - AulaViva Backend Validation

on:
  push:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-validation:
    name: Validar construccion Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar construccion de imagen
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
