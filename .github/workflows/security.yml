name: AulaViva - Security Analysis

# Solo corre cuando cambia algo que afecta a la seguridad del software entregado
# (codigo, dependencias, Terraform, manifiestos k8s, politicas y configuracion de
# los propios escaneos). NO corre por cambios en documentacion (*.md, ADR, docs/),
# imagenes/evidencias (png, jpg...) ni otros archivos sin efecto en la imagen.
on:
  push:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - "terraform/**"
      - "k8s/**"
      - ".semgrep/**"
      - ".zap/**"
      - ".trivyignore"
      - ".gitleaksignore"
      - ".github/workflows/security.yml"
      - ".github/workflows/ci.yml"   # ci.yml publica la imagen que se firma y escanea aqui

  pull_request:
    branches:
      - main
      - desarrollo
    paths:
      - "backend/**"
      - "terraform/**"
      - "k8s/**"
      - ".semgrep/**"
      - ".zap/**"
      - ".trivyignore"
      - ".gitleaksignore"
      - ".github/workflows/security.yml"
      - ".github/workflows/ci.yml"
      
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a un PR cancela la ejecucion anterior de ese PR. En push a
# `desarrollo` NUNCA se cancela: podria cortar una firma o attestation a medias.
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ---------------------------------------------------------------------------
  # SAST - Semgrep (p/java + p/owasp-top-ten + reglas propias en .semgrep/)
  # Gate bloqueante: cualquier hallazgo (--error) o fallo de la herramienta
  # hace fallar el job.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST - Semgrep (Java / OWASP Top 10)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Ejecutar analisis SAST
        id: semgrep
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config .semgrep/ \
            --include "*.java" \
            --metrics=off \
            --error \
            --sarif \
            --output semgrep.sarif \
            backend/src

      - name: Guardar resultados SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-results
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Aplicar gate bloqueante SAST
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "El analisis SAST encontro hallazgos bloqueantes o fallo."
          echo "Revisa los resultados de Semgrep (artefacto semgrep-sast-results)."
          exit 1

  # ---------------------------------------------------------------------------
  # SCA - Trivy (filesystem) + SBOM CycloneDX
  # Gate bloqueante en HIGH/CRITICAL con parche disponible (ignore-unfixed).
  # El SBOM se genera y se publica SIEMPRE (aunque Trivy falle), para poder
  # consultar el inventario ante un CVE.
  # ---------------------------------------------------------------------------
  sca:
    name: SCA - Analisis de dependencias y SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Analizar dependencias con Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Generar SBOM CycloneDX
        working-directory: backend
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom \
            -DoutputFormat=json \
            -DoutputName=sbom

      - name: Validar SBOM CycloneDX
        id: sbom-validation
        run: |
          if [ ! -f backend/target/sbom.json ]; then
            echo "ERROR: No se encontro backend/target/sbom.json"
            exit 1
          fi

          jq -e '
            .bomFormat == "CycloneDX" and
            .specVersion != null and
            (.components | type == "array") and
            (.components | length > 0)
          ' backend/target/sbom.json

          echo "SBOM CycloneDX valido."
          echo "Componentes: $(jq '.components | length' backend/target/sbom.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar SBOM como artefacto
        if: always() && steps.sbom-validation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aulaviva-sbom
          path: backend/target/sbom.json
          if-no-files-found: error
          retention-days: 90

      - name: Aplicar gate bloqueante SCA
        if: always() && steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy encontro vulnerabilidades HIGH/CRITICAL con parche disponible."
          echo "Corrige la dependencia o documenta una excepcion VEX (ver README)."
          exit 1

  # ---------------------------------------------------------------------------
  # Secrets - gitleaks con historial completo (fetch-depth: 0)
  # ---------------------------------------------------------------------------
  secrets:
    name: Secrets - Deteccion de secretos
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Descargar historial Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escanear historial Git completo
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/path" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect \
            --source=/path \
            --log-opts="--all" \
            --redact \
            --verbose \
            --exit-code=2

  # ---------------------------------------------------------------------------
  # IaC Scan (S10) - Checkov sobre terraform/
  # Gate bloqueante: soft_fail false -> cualquier check fallido hace fallar el job.
  # Excepciones (skip_check): solo mediante PR con ADR de justificacion
  # (ver docs/adr/0006-supply-chain.md, seccion 5.2). Hoy no hay ninguna.
  # ---------------------------------------------------------------------------
  iac-scan:
    name: IaC Scan - Checkov (Terraform)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Analizar Terraform con Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          quiet: true

  # ---------------------------------------------------------------------------
  # Container Scan (S10) - Trivy sobre la imagen construida
  # Construye la imagen del backend SIN publicarla (post-build, pre-push) y la
  # analiza: OS y librerias. Gate bloqueante en HIGH/CRITICAL con parche
  # disponible (ignore-unfixed, mismo criterio que el SCA de la S09).
  # ---------------------------------------------------------------------------
  container-scan:
    name: Container Scan - Trivy (imagen)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen para analisis
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: aulaviva-backend:scan

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: aulaviva-backend:scan
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table

  # ---------------------------------------------------------------------------
  # Supply chain (S10) - Firma Cosign keyless + attestation SLSA nivel 2
  #
  # Corre en TODOS los disparadores de este workflow (push a desarrollo y PR
  # hacia main/desarrollo) y siempre termina verificando con `cosign verify`:
  # si la imagen no esta firmada y con attestation, el check falla.
  #
  #  - push a `desarrollo` -> firma + attestation (si aun no existen) y verifica.
  #  - pull_request        -> solo verifica. Nunca firma: desde un PR la
  #                           identidad OIDC seria refs/pull/N/merge y no la
  #                           autorizada (refs/heads/desarrollo).
  #
  # Imagen objetivo: la que ci.yml publico para el commit (tag sha-<commit>).
  # Si ese commit no toco backend/** y CI no corrio, se usa la ultima imagen
  # publicada con exito en `desarrollo`. Este job NO reconstruye la imagen y
  # trabaja siempre sobre `imagen@sha256:...`.
  # ---------------------------------------------------------------------------
  sign-and-attest:
    name: Supply chain - Firma Cosign y attestation SLSA
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets, iac-scan, container-scan]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/desarrollo') ||
      github.event_name == 'pull_request'
    timeout-minutes: 30

    outputs:
      digest: ${{ steps.image.outputs.digest }}

    permissions:
      contents: read
      packages: write   # adjuntar firma y attestation al registro OCI (GHCR)
      id-token: write   # token OIDC para la firma keyless (Sigstore)
      actions: read     # consultar los runs de ci.yml y security.yml

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/equipo-aulaviva-backend
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      # Identidad autorizada: la de ESTE workflow ejecutado en `desarrollo`.
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/security.yml@refs/heads/desarrollo
      # En un PR, github.sha es el commit de merge; el codigo es el head del PR.
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SIGN: ${{ github.event_name == 'push' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver digest de la imagen construida por CI
        id: image
        run: |
          set -euo pipefail

          resolve_digest() {
            docker buildx imagetools inspect "${IMAGE}:sha-$1" \
              --format '{{.Manifest.Digest}}' 2>/dev/null
          }

          # 1) Run de ci.yml para este commit (puede tardar unos segundos en aparecer).
          RUN_ID=""
          for _ in $(seq 1 12); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$COMMIT_SHA" --event push --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done

          DIGEST=""
          IMG_SHA="$COMMIT_SHA"
          if [ -n "$RUN_ID" ]; then
            # 2) Esperar a que CI publique la imagen de este commit.
            for _ in $(seq 1 45); do
              if DIGEST="$(resolve_digest "$COMMIT_SHA")" && [ -n "$DIGEST" ]; then break; fi
              DIGEST=""
              STATUS="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
              if [ "$STATUS" = "completed" ]; then
                echo "::error::ci.yml termino sin publicar ${IMAGE}:sha-${COMMIT_SHA}."
                exit 1
              fi
              sleep 20
            done
          else
            # Commit sin cambios en backend/**: se usa la ultima imagen publicada por CI.
            IMG_SHA="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch desarrollo --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha // empty')"
            [ -n "$IMG_SHA" ] && DIGEST="$(resolve_digest "$IMG_SHA")" || true
            echo "ci.yml no corrio para ${COMMIT_SHA}; se usa la imagen del commit ${IMG_SHA:-?} (ultimo CI exitoso en desarrollo)." >> "$GITHUB_STEP_SUMMARY"
          fi

          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::No se encontro una imagen de AulaViva para firmar o verificar."; exit 1 ;;
          esac

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "img_sha=${IMG_SHA}" >> "$GITHUB_OUTPUT"
          echo "Imagen: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comprobar si la imagen ya esta firmada
        id: precheck
        if: env.SIGN == 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if cosign verify \
               --certificate-identity "${IDENTITY}" \
               --certificate-oidc-issuer "${OIDC_ISSUER}" \
               "${IMAGE}@${DIGEST}" > /dev/null 2>&1; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "La imagen ya estaba firmada por este workflow; no se vuelve a firmar."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Firmar la imagen por digest (Cosign keyless)
        if: env.SIGN == 'true' && steps.precheck.outputs.signed != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Extraer provenance SLSA de la imagen
        if: env.SIGN == 'true' && steps.precheck.outputs.signed != 'true'
        id: provenance
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{json .Provenance.SLSA}}' > provenance.json

          # slsaprovenance = SLSA v0.2 (buildx por defecto); slsaprovenance1 = SLSA v1.
          if jq -e '.builder.id and .buildType and (.materials | type == "array")' provenance.json > /dev/null; then
            echo "type=slsaprovenance" >> "$GITHUB_OUTPUT"
          elif jq -e '.buildDefinition and .runDetails' provenance.json > /dev/null; then
            echo "type=slsaprovenance1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::La imagen no trae una provenance SLSA valida (revisar provenance de build-push-action en ci.yml)."
            exit 1
          fi

      - name: Adjuntar attestation SLSA nivel 2
        if: env.SIGN == 'true' && steps.precheck.outputs.signed != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          PREDICATE_TYPE: ${{ steps.provenance.outputs.type }}
        run: |
          cosign attest --yes \
            --type "${PREDICATE_TYPE}" \
            --predicate provenance.json \
            "${IMAGE}@${DIGEST}"

      - name: Esperar la firma (solo en PR)
        if: env.SIGN != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMG_SHA: ${{ steps.image.outputs.img_sha }}
        run: |
          # Si el push a desarrollo que firma esta imagen sigue en curso, esperarlo.
          for _ in $(seq 1 30); do
            if cosign verify \
                 --certificate-identity "${IDENTITY}" \
                 --certificate-oidc-issuer "${OIDC_ISSUER}" \
                 "${IMAGE}@${DIGEST}" > /dev/null 2>&1; then
              exit 0
            fi
            STATUS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow security.yml \
              --commit "$IMG_SHA" --event push --limit 1 --json status --jq '.[0].status // "none"')"
            case "$STATUS" in
              completed|none) exit 0 ;;   # nada que esperar: la verificacion de abajo decide
            esac
            echo "El push que firma ${IMG_SHA} sigue en curso (${STATUS}); reintentando..."
            sleep 20
          done

      - name: Verificar firma (cosign verify)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${IMAGE}@${DIGEST}"

      - name: Verificar attestation SLSA (cosign verify-attestation)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          VERIFIED=""
          for TYPE in slsaprovenance slsaprovenance1; do
            if cosign verify-attestation \
                 --type "$TYPE" \
                 --certificate-identity "${IDENTITY}" \
                 --certificate-oidc-issuer "${OIDC_ISSUER}" \
                 "${IMAGE}@${DIGEST}" > /dev/null; then
              VERIFIED="$TYPE"
              break
            fi
          done
          [ -n "$VERIFIED" ] || { echo "::error::No hay attestation SLSA verificable para ${IMAGE}@${DIGEST}."; exit 1; }

          {
            echo "### Supply chain verificada"
            echo "- Imagen: \`${IMAGE}@${DIGEST}\`"
            echo "- Firma Cosign (keyless): OK"
            echo "- Attestation \`${VERIFIED}\`: OK"
            echo "- Identidad: \`${IDENTITY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # DAST (S10) - OWASP ZAP baseline contra staging
  # Staging = la imagen firmada y verificada por sign-and-attest, levantada en
  # el runner (http://localhost:8080) con datos sinteticos (ver
  # docs/qa/s10-dast-y-admision.md). Falla si ZAP reporta riesgo Medium o
  # superior; los falsos positivos se registran en .zap/rules.tsv.
  # ---------------------------------------------------------------------------
  dast:
    name: DAST - ZAP baseline (staging)
    runs-on: ubuntu-latest
    needs: sign-and-attest
    timeout-minutes: 9   # < 10 min

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/equipo-aulaviva-backend
      DIGEST: ${{ needs.sign-and-attest.outputs.digest }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar staging (imagen firmada por digest)
        run: |
          set -euo pipefail
          docker run -d --name aulaviva-staging -p 8080:8080 \
            "${IMAGE}@${DIGEST}"

          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "Staging listo: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          docker logs aulaviva-staging
          echo "::error::El staging no quedo listo a tiempo."
          exit 1

      - name: Ejecutar ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: "-m 2 -T 5"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Gate DAST (falla en riesgo Medium o superior)
        run: |
          set -euo pipefail
          REPORT=report_json.json
          [ -f "$REPORT" ] || { echo "::error::ZAP no genero $REPORT."; exit 1; }

          COUNT="$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 2)] | length' "$REPORT")"
          echo "Hallazgos Medium o superior: ${COUNT}" >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            jq -r '.site[].alerts[] | select((.riskcode | tonumber) >= 2)
                   | "- [" + .riskdesc + "] " + .name + " (regla " + .pluginid + ")"' "$REPORT" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::ZAP encontro hallazgos de riesgo Medium o superior."
            exit 1
          fi

      - name: Detener staging
        if: always()
        run: docker rm -f aulaviva-staging || true
