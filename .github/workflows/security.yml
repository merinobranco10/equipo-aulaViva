name: AulaViva - Security Analysis

on:
  push:
    branches:
      - desarrollo

  pull_request:
    branches:
      - main
      - desarrollo

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # SAST - Semgrep (p/java + p/owasp-top-ten + reglas propias en .semgrep/)
  # Gate bloqueante: cualquier hallazgo (--error) o fallo de la herramienta
  # hace fallar el job.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST - Semgrep (Java / OWASP Top 10)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Ejecutar analisis SAST
        id: semgrep
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config .semgrep/ \
            --include "*.java" \
            --metrics=off \
            --error \
            --sarif \
            --output semgrep.sarif \
            backend/src

      - name: Guardar resultados SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-results
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Aplicar gate bloqueante SAST
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "El analisis SAST encontro hallazgos bloqueantes o fallo."
          echo "Revisa los resultados de Semgrep (artefacto semgrep-sast-results)."
          exit 1

  # ---------------------------------------------------------------------------
  # SCA - Trivy (filesystem) + SBOM CycloneDX
  # Gate bloqueante en HIGH/CRITICAL con parche disponible (ignore-unfixed).
  # El SBOM se genera y se publica SIEMPRE (aunque Trivy falle), para poder
  # consultar el inventario ante un CVE.
  # ---------------------------------------------------------------------------
  sca:
    name: SCA - Analisis de dependencias y SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Analizar dependencias con Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Generar SBOM CycloneDX
        working-directory: backend
        run: |
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom \
            -DoutputFormat=json \
            -DoutputName=sbom

      - name: Validar SBOM CycloneDX
        id: sbom-validation
        run: |
          if [ ! -f backend/target/sbom.json ]; then
            echo "ERROR: No se encontro backend/target/sbom.json"
            exit 1
          fi

          jq -e '
            .bomFormat == "CycloneDX" and
            .specVersion != null and
            (.components | type == "array") and
            (.components | length > 0)
          ' backend/target/sbom.json

          echo "SBOM CycloneDX valido."
          echo "Componentes: $(jq '.components | length' backend/target/sbom.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar SBOM como artefacto
        if: always() && steps.sbom-validation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aulaviva-sbom
          path: backend/target/sbom.json
          if-no-files-found: error
          retention-days: 90

      - name: Aplicar gate bloqueante SCA
        if: always() && steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy encontro vulnerabilidades HIGH/CRITICAL con parche disponible."
          echo "Corrige la dependencia o documenta una excepcion VEX (ver README)."
          exit 1

  # ---------------------------------------------------------------------------
  # Secrets - gitleaks con historial completo (fetch-depth: 0)
  # ---------------------------------------------------------------------------
  secrets:
    name: Secrets - Deteccion de secretos
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Descargar historial Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escanear historial Git completo
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/path" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect \
            --source=/path \
            --log-opts="--all" \
            --redact \
            --verbose \
            --exit-code=2

  # ---------------------------------------------------------------------------
  # Supply chain - Firma Cosign keyless + attestation SLSA nivel 2
  # Solo corre en push a `desarrollo`, cuando sast / sca / secrets ya pasaron.
  # La imagen la construye y publica ci.yml; este job NO la reconstruye: espera
  # la imagen del mismo commit (tag sha-<commit>), la resuelve a su digest
  # inmutable y trabaja siempre sobre `imagen@sha256:...`.
  # La identidad OIDC con la que se firma es la de ESTE workflow (security.yml).
  # ---------------------------------------------------------------------------
  sign-and-attest:
    name: Supply chain - Firma Cosign y attestation SLSA
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/desarrollo'
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write   # adjuntar firma y attestation al registro OCI (GHCR)
      id-token: write   # token OIDC para la firma keyless (Sigstore)
      actions: read     # localizar el run de ci.yml del mismo commit

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/equipo-aulaviva-backend
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/security.yml@refs/heads/desarrollo

    steps:
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver digest de la imagen construida por CI
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 1) Run de ci.yml para este commit (puede tardar unos segundos en aparecer).
          RUN_ID=""
          for _ in $(seq 1 12); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::notice::ci.yml no se ejecuto para ${GITHUB_SHA} (sin cambios en backend/**): no hay imagen nueva que firmar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Esperar a que CI publique la imagen y resolver su digest.
          DIGEST=""
          for _ in $(seq 1 45); do
            if DIGEST="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" \
                 --format '{{.Manifest.Digest}}' 2>/dev/null)" && [ -n "$DIGEST" ]; then
              break
            fi
            DIGEST=""
            STATUS="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
            if [ "$STATUS" = "completed" ]; then
              echo "::error::ci.yml termino sin publicar ${IMAGE}:sha-${GITHUB_SHA}. No se firma nada."
              exit 1
            fi
            sleep 20
          done

          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::No se pudo resolver el digest de la imagen."; exit 1 ;;
          esac

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Imagen a firmar: ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Firmar la imagen por digest (Cosign keyless)
        if: steps.image.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Extraer provenance SLSA de la imagen
        if: steps.image.outputs.skip != 'true'
        id: provenance
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{json .Provenance.SLSA}}' > provenance.json

          # slsaprovenance = SLSA v0.2 (buildx por defecto); slsaprovenance1 = SLSA v1.
          if jq -e '.builder.id and .buildType and (.materials | type == "array")' provenance.json > /dev/null; then
            echo "type=slsaprovenance" >> "$GITHUB_OUTPUT"
          elif jq -e '.buildDefinition and .runDetails' provenance.json > /dev/null; then
            echo "type=slsaprovenance1" >> "$GITHUB_OUTPUT"
          else
            echo "::error::La imagen no trae una provenance SLSA valida (revisar provenance de build-push-action en ci.yml)."
            exit 1
          fi

      - name: Adjuntar attestation SLSA nivel 2
        if: steps.image.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          PREDICATE_TYPE: ${{ steps.provenance.outputs.type }}
        run: |
          cosign attest --yes \
            --type "${PREDICATE_TYPE}" \
            --predicate provenance.json \
            "${IMAGE}@${DIGEST}"

      - name: Verificar firma (cosign verify)
        if: steps.image.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${IMAGE}@${DIGEST}"

      - name: Verificar attestation SLSA (cosign verify-attestation)
        if: steps.image.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          PREDICATE_TYPE: ${{ steps.provenance.outputs.type }}
        run: |
          cosign verify-attestation \
            --type "${PREDICATE_TYPE}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${IMAGE}@${DIGEST}" > /dev/null

          {
            echo "### Supply chain verificada"
            echo "- Imagen: \`${IMAGE}@${DIGEST}\`"
            echo "- Firma Cosign (keyless): OK"
            echo "- Attestation \`${PREDICATE_TYPE}\`: OK"
            echo "- Identidad: \`${IDENTITY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
