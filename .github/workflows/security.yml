name: AulaViva - Security Analysis

on:
  push:
    branches:
      - desarrollo
    paths:
      - "backend/**"
      - ".semgrep/**"
      - ".github/workflows/security.yml"

  pull_request:
    branches:
      - main
      - desarrollo
    paths:
      - "backend/**"
      - ".semgrep/**"
      - ".github/workflows/security.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  sast:
    name: SAST - Semgrep (Java / OWASP Top 10)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Ejecutar analisis SAST
        id: semgrep
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config .semgrep/java-security.yml \
            --include "*.java" \
            --metrics=off \
            --error \
            --sarif \
            --output semgrep.sarif \
            backend/src

      - name: Guardar resultados SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-results
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Aplicar gate bloqueante SAST
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "El analisis SAST encontro hallazgos bloqueantes o fallo."
          echo "Revisa los resultados de Semgrep."
          exit 1

  sca:
    name: SCA - Analisis de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Analizar dependencias con Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secrets:
    name: Secrets - Deteccion de secretos
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Descargar historial Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
