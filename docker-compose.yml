services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aulaviva
      POSTGRES_USER: aulaviva
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes: 
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulaviva"]
      interval: 5s
      retries: 10

  app:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: pg,demo
      DB_URL: jdbc:postgresql://db:5432/aulaviva
      DB_USER: aulaviva
      DB_PASSWORD: ${DB_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Define DEMO_PASSWORD}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b
      LLM_FALLBACK_MODEL: openai/gpt-oss-20b
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8080:8080"
    mem_limit: 768m
    depends_on:
      db: 
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
