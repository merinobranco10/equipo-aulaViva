- macro: aulaviva_workload
  condition: (k8s.ns.name = "equipo-aulaviva" and k8s.pod.name startswith "aulaviva-")

# Regla 1 - Shell en contenedor (severidad media)
- rule: AulaViva - Shell en contenedor
  desc: Se abrió una shell dentro de un contenedor de AulaViva (tutor IA/RAG, datos de estudiantes).
  condition: >
    spawned_process and container and aulaviva_workload
    and proc.name in (bash, sh, ash, dash, zsh)
  output: >
    Shell en contenedor AulaViva (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name
    image=%container.image.repository cmd=%proc.cmdline)
  priority: WARNING
  tags: [aulaviva, shell]

# Regla 2 - Escritura en /etc (High)
- rule: AulaViva - Escritura en /etc de contenedor
  desc: Un proceso escribió en /etc dentro de un contenedor de AulaViva.
  condition: >
    open_write and container and aulaviva_workload
    and fd.name startswith /etc/
  output: >
    Escritura en /etc de AulaViva (file=%fd.name user=%user.name pod=%k8s.pod.name
    ns=%k8s.ns.name cmd=%proc.cmdline)
  priority: CRITICAL
  tags: [aulaviva, filesystem]

# Regla 3 - Conexión saliente inesperada (High)
- rule: AulaViva - Conexion saliente inesperada
  desc: Un contenedor de AulaViva se conectó a una IP pública en un puerto distinto de 443 (posible fuga de datos de estudiantes).
  condition: >
    outbound and container and aulaviva_workload
    and not fd.snet in (rfc_1918_addresses)
    and not fd.sport = 443
  output: >
    Conexion saliente inesperada de AulaViva (dest=%fd.sip:%fd.sport pod=%k8s.pod.name
    ns=%k8s.ns.name cmd=%proc.cmdline)
  priority: ERROR
  tags: [aulaviva, network]
