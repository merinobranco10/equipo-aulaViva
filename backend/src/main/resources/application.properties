spring.application.name=aulaviva-backend
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Base de datos por defecto: H2 en memoria (PC local de 8 GB y tests).
# En docker compose / staging se activa el perfil "pg" (application-pg.properties).
spring.datasource.url=jdbc:h2:mem:aulaviva;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Errores en formato ProblemDetails (RFC 9457) tambien para errores estandar de Spring
spring.mvc.problemdetails.enabled=true

# Contrasena de los usuarios de demo (perfil "demo"). Nunca se escribe en el repo:
# se entrega por la variable de entorno DEMO_PASSWORD.
aulaviva.demo.password=${DEMO_PASSWORD:}
