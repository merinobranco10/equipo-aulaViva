spring.application.name=aulaviva-backend
server.port=${SERVER_PORT:8080}
# JSON con charset explícito: PowerShell 5.1 muestra mal las tildes si falta
server.servlet.encoding.force-response=true

management.endpoints.web.exposure.include=health,info,prometheus,circuitbreakers
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Base de datos por defecto: H2 en memoria (PC local de 8 GB y tests).
# En docker compose / staging se activa el perfil "pg" (application-pg.properties).
spring.datasource.url=jdbc:h2:mem:aulaviva;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Errores en formato ProblemDetails (RFC 9457) tambien para errores estandar de Spring
spring.mvc.problemdetails.enabled=true

# Contrasena de los usuarios de demo (perfil "demo"). Nunca se escribe en el repo:
# se entrega por la variable de entorno DEMO_PASSWORD.
aulaviva.demo.password=${DEMO_PASSWORD:}

# --- Tutor IA (S18 Día 4, ADR 0009) ---
aulaviva.llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
aulaviva.llm.model=${LLM_MODEL:openai/gpt-oss-120b}
aulaviva.llm.fallback-model=${LLM_FALLBACK_MODEL:openai/gpt-oss-20b}
aulaviva.llm.api-key=${LLM_API_KEY:}
aulaviva.llm.reasoning-effort=${LLM_REASONING_EFFORT:low}
# Con gpt-oss nunca menos de 300: el cliente aplica ese mínimo.
aulaviva.llm.max-tokens=${LLM_MAX_TOKENS:400}
aulaviva.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:8}
aulaviva.tutor.top-k=${RAG_TOP_K:5}
aulaviva.tutor.min-score=${TUTOR_MIN_SCORE:1.5}
aulaviva.tutor.cache-enabled=true
aulaviva.tutor.daily-token-budget=${TUTOR_DAILY_TOKEN_BUDGET:50000}

resilience4j.circuitbreaker.instances.llm.sliding-window-size=10
resilience4j.circuitbreaker.instances.llm.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=30s
resilience4j.retry.instances.llm.max-attempts=2
resilience4j.retry.instances.llm.wait-duration=500ms
