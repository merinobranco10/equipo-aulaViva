<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AulaViva · Ingresar</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="center">
  <main class="card login">
    <h1>AulaViva</h1>
    <p class="muted">Demo con datos ficticios</p>
    <form id="login-form">
      <label for="user">Usuario</label>
      <input id="user" autocomplete="username" required>
      <label for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
    </form>
    <div id="msg" role="alert" hidden></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
