apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-signature
  annotations:
    policies.kyverno.io/title: Requerir Firma de Imagen
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Exige que todas las imágenes desplegadas en el namespace equipo-aulaviva
      estén firmadas criptográficamente con Cosign.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-cosign-signature
      match:
        any:
        - resources:
            kinds:
              - Pod
            namespaces:
              - equipo-aulaviva
      verifyImages:
      - imageReferences:
        - "ghcr.io/merinobranco10/equipo-aulaviva-backend*"
        attestors:
        - entries:
          - keyless:
              subject: "https://github.com/merinobranco10/equipo-aulaViva/.github/workflows/ci.yml@refs/heads/desarrollo"
              issuer: "https://token.actions.githubusercontent.com"
